; Stock 2023 original M5Stack Cardputer K132, ESP32-S3FN8, NO PSRAM.
; SD app switching requires a factory launcher and a separate 3MiB OTA app slot.
[platformio]
default_envs = cardputer_original

[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions/suite_8mb_factory.csv
board_upload.maximum_size = 3145728
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer

[env:cardputer_original]
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DSUITE_FACTORY_LAUNCHER=1
build_src_filter =
    +<*>
    -<sd_app_main.cpp>

