name: P20 pinned GPL C64 adapted original K132 build
on:
  push:
    branches: [feature/cardputer-k132-p20-c64-import-field-suite]
  workflow_dispatch:
jobs:
  c64-upstream:
    name: Build upstream C64 with Open ROMs and factory return guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile adapter from pinned upstream and Open ROMs
        run: |
          python3 tools/build-c64-upstream.py \
            --work "$RUNNER_TEMP/p20-c64" \
            --out-dir builds/c64
      - name: Package image with manifest and corresponding source
        run: |
          python3 tools/package-c64-upstream.py \
            --binary builds/c64/C64.BIN \
            --source "$RUNNER_TEMP/p20-c64/source" \
            --out Cardputer-P20-C64-SD-App.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cardputer-k132-c64-openrom-unverified
          path: Cardputer-P20-C64-SD-App.zip
          retention-days: 14
          if-no-files-found: error
