name: K132 source checks
on:
  push:
    branches: [main, feature/cardputer-k132-advanced-midi, feature/cardputer-k132-pocket-tools]
  pull_request:
    branches: [main]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host-side regression tests
        run: bash tools/run-host-tests.sh
  cardputer-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile for original Cardputer
        run: pio run -e cardputer_original
      - name: Upload unverified firmware for hardware acceptance
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-k132-pocket-tools-unverified
          path: .pio/build/cardputer_original/firmware.bin
          if-no-files-found: error
          retention-days: 14
