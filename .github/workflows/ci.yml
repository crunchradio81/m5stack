name: K132 source checks
on:
  push:
    branches: [main, feature/cardputer-k132-p1-core]
  pull_request:
    branches: [main]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host-side regression tests
        run: bash tools/run-host-tests.sh
  cardputer-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile for original Cardputer
        run: pio run -e cardputer_original
