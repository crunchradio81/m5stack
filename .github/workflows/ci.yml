name: Original Cardputer K132 suite checks
concurrency:
  group: original-k132-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feature/cardputer-k132-advanced-midi, feature/cardputer-k132-pocket-tools, feature/cardputer-k132-sd-launcher-and-apps, feature/cardputer-k132-sd-collections, feature/cardputer-k132-dev-system, feature/cardputer-k132-field-media-files-ir, feature/cardputer-k132-p8-networking, feature/cardputer-k132-p9-midi-expansion]
  pull_request:
    branches: [main]
jobs:
  host-tests:
    name: Portable C++ and SD format tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host regressions
        run: bash tools/run-host-tests.sh

  factory-launcher:
    name: Original K132 factory launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build factory suite firmware
        run: pio run -e cardputer_original
      - name: Retain unverified factory launcher firmware
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-k132-factory-unverified
          path: .pio/build/cardputer_original/firmware.bin
          retention-days: 14
          if-no-files-found: error

  sd-apps:
    name: "SD app: ${{ matrix.target }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [sd_metronome, sd_piano, sd_channels, sd_ble, sd_arcade, sd_office, sd_inspect, sd_musiclab, sd_devtools, sd_system, sd_irtools, sd_wireless, sd_audiolab, sd_filetools, sd_nettools, sd_miditools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build individual SD app
        run: pio run -e ${{ matrix.target }}
      - name: Retain SD app for packaging
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-k132-${{ matrix.target }}-unverified
          path: .pio/build/${{ matrix.target }}/firmware.bin
          retention-days: 14
          if-no-files-found: error

  sd-card-pack:
    name: Pack SD app binaries with checksum manifests
    runs-on: ubuntu-latest
    needs: [host-tests, sd-apps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cardputer-k132-sd_*-unverified
          path: builds
      - name: Make FAT32 SD app library
        run: python3 tools/package-sd-apps.py --build-root builds --artifact-layout --out Cardputer-K132-SD-App-Pack.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cardputer-k132-sd-app-pack-unverified
          path: Cardputer-K132-SD-App-Pack.zip
          retention-days: 14
          if-no-files-found: error
